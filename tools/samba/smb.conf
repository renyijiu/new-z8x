[global]
  server role = standalone server
  workgroup = WORKGROUP
  netbios name = APKTRANSFER
  security = user
  map to guest = Never
  server min protocol = NT1
  server max protocol = SMB3
  ntlm auth = ntlmv1-permitted
  smb ports = 445
  load printers = no
  disable spoolss = yes
  printing = bsd
  printcap name = /dev/null
  log level = 1 auth:2
  logging = stdout

[ProjectorTransfer]
  path = /transfer
  browseable = yes
  read only = yes
  guest ok = no
  valid users = projector
  follow symlinks = no
  wide links = no
